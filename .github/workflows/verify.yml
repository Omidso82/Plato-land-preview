name: Build and typecheck
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

      - uses: denoland/setup-deno@v2
      - run: deno test supabase/functions/_shared/series2-qualification.test.ts
      - run: deno test supabase/functions/plato-land-series2-progression/_shared/series2-bracket.test.ts
      - run: deno test supabase/functions/_shared/plato-id-scanner-contract.test.ts
      - run: deno test supabase/functions/_shared/plato-id-scanner-extraction.test.ts
      - run: deno test supabase/functions/_shared/plato-id-scanner-duplicate-audit.test.ts
      - run: deno test supabase/functions/_shared/plato-id-scanner-result-adapter.test.ts
      - run: deno test supabase/functions/_shared/plato-id-scanner-google-vision-adapter.test.ts

      - run: deno test supabase/functions/_shared/plato-id-scanner-reports.test.ts
      - run: deno test supabase/functions/_shared/plato-id-scanner-review.test.ts
      - run: deno test src/plato-id-scanner-review-store.test.ts
      - run: deno test src/plato-id-scanner-date-window.test.ts
