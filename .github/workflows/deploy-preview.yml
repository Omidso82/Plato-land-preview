name: Deploy PLATO LAND website
# Re-run production-domain deployment after registration preflight fix in dcddb39c569d74579d16ace544abf740328a9a64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript verification
        run: npm run typecheck
      - name: Build production site
        run: npm run build
      - name: Verify and prepare GitHub Pages output
        run: |
          test -s dist/index.html
          printf 'platoland.org\n' > dist/CNAME
          cp dist/index.html dist/404.html
          echo "Verified production entry point:"
          ls -lah dist/index.html dist/CNAME dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to platoland.org via GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
